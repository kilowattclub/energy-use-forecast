[package]
name = "energy-use-forecast"
version = "0.1.0"
edition = "2021"
description = "Household electricity usage forecasts from measured history"
repository = "https://github.com/kilowattclub/energy-use-forecast"
readme = "README.md"
keywords = ["energy", "forecast", "electricity"]
categories = ["science"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
crate-type = ["lib"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uom = "0.38.0"
